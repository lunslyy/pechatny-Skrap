<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Магазин для скрапбукинга</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Caveat:wght@600&display=swap" rel="stylesheet">
<script>
  try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}
</script>
<style>
:root{--bg:#eaf1ee;--ink:#19302c;--mut:#566b66;--card:#fffdfb;--line:#c3d3cd;--acc:#d6336c;--on-acc:#fff;--mint:#2b9a8a;--tape:rgba(255,196,218,.8);--dot:#b9cbc4}
[data-theme=dark]{--bg:#121a2a;--ink:#e9eef3;--mut:#93a4b6;--card:#1b2538;--line:#2d3b55;--acc:#ff6b9d;--on-acc:#1a1020;--mint:#5fd3c0;--tape:rgba(255,140,180,.5);--dot:#26334c}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:400 17px/1.6 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(var(--dot) 1.4px,transparent 1.5px) 0 0/26px 26px;min-height:100vh;transition:background-color .3s,color .3s}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{padding:18px 0 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-weight:900;font-size:18px}
.btn{font:700 16px Nunito,sans-serif;border:2px solid var(--ink);background:var(--acc);color:var(--on-acc);padding:9px 18px;border-radius:999px;text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .15s,box-shadow .15s;display:inline-block}
.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.right{display:flex;gap:10px;align-items:center}
.hero{padding:44px 0 30px}
.ruler{height:30px;border-radius:4px;background:var(--mint);position:relative;transform-origin:left;animation:draw 1.1s cubic-bezier(.7,0,.2,1) both;margin-bottom:26px}
.ruler::after{content:"";position:absolute;inset:auto 0 0;height:14px;background:repeating-linear-gradient(90deg,var(--bg) 0 2px,transparent 2px 12px)}
.ruler::before{content:"";position:absolute;inset:auto 0 0;height:24px;background:repeating-linear-gradient(90deg,var(--bg) 0 2px,transparent 2px 60px)}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h1{font-weight:900;font-size:clamp(38px,8vw,80px);line-height:1.02;margin:0 0 12px;letter-spacing:-.02em;animation:rise .7s .5s both}
.tag{font:600 clamp(22px,3.4vw,30px)/1.2 Caveat,cursive;color:var(--acc);max-width:640px;margin:0;animation:rise .7s .7s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 28px}
nav button{font:700 16px Nunito,sans-serif;color:var(--ink);background:transparent;border:2px dashed var(--line);border-radius:10px;padding:8px 16px;cursor:pointer;transition:background .2s,border-color .2s}
nav button:hover{border-color:var(--ink)}
nav button[aria-selected=true]{background:var(--card);border:2px solid var(--ink)}
section[hidden]{display:none}
section{animation:fade .35s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:30px 24px;padding-bottom:40px}
.card{position:relative;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:12px 12px 14px;cursor:pointer;transform:rotate(var(--r));transition:transform .25s cubic-bezier(.3,1.6,.5,1);display:flex;flex-direction:column;gap:8px}
.card:hover,.card:focus-visible{transform:rotate(0) translateY(-5px)}
.tape{position:absolute;top:-12px;left:50%;width:76px;height:22px;margin-left:-38px;background:var(--tape);transform:rotate(-3deg)}
.pic{position:relative;aspect-ratio:1;border-radius:3px;background:var(--line);display:grid;place-items:center;overflow:hidden}
.pic b{font:900 72px Nunito;color:var(--card)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nm{font-weight:900;line-height:1.25}
.pr{font:600 25px/1 Caveat,cursive;color:var(--acc)}
.empty{padding:30px 0 60px;color:var(--mut)}
.steps{list-style:none;margin:0;padding:0 0 40px;max-width:640px;display:grid;gap:18px;counter-reset:s}
.steps li{counter-increment:s;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:14px 18px 14px 64px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:36px;height:36px;border-radius:50%;background:var(--mint);color:var(--bg);font-weight:900;display:grid;place-items:center}
.steps b{display:block}
.about{max-width:620px;padding-bottom:50px}
.about .btn{margin-top:8px}
footer{border-top:2px dashed var(--line);padding:22px 0 34px;color:var(--mut);font-size:15px}
dialog{border:2px solid var(--ink);border-radius:8px;padding:0;background:var(--card);color:var(--ink);width:min(520px,92vw);box-shadow:8px 8px 0 var(--ink)}
dialog::backdrop{background:rgba(10,15,25,.6)}
dialog[open]{animation:fade .25s both}
.m-pic{aspect-ratio:4/3;position:relative;background:var(--line)}
.m-pic img{width:100%;height:100%;object-fit:cover;display:block}
.m-body{padding:18px 22px 22px}
.m-body h2{margin:0 0 4px;font-size:24px;line-height:1.2}
.m-x{position:absolute;top:10px;right:10px;z-index:2;width:40px;height:40px;padding:0;border-radius:50%;box-shadow:none;font-size:20px}
@media(max-width:560px){.btn.hide-s{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo" id="logo"></div>
  <div class="right">
    <button class="btn ghost" id="theme" aria-label="Сменить тему"></button>
    <a class="btn hide-s" id="vk1" target="_blank" rel="noopener"></a>
  </div>
</div></header>

<main class="wrap">
  <div class="hero">
    <div class="ruler" aria-hidden="true"></div>
    <h1 id="title"></h1>
    <p class="tag" id="tag"></p>
  </div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-t="in">В наличии</button>
    <button role="tab" data-t="pre">Под заказ</button>
    <button role="tab" data-t="how">Как заказать</button>
    <button role="tab" data-t="about">О магазине</button>
  </nav>
  <section id="p-in" class="grid"></section>
  <section id="p-pre" class="grid" hidden></section>
  <section id="p-how" hidden><ol class="steps" id="steps"></ol></section>
  <section id="p-about" hidden><div class="about" id="about"></div></section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<dialog id="dlg">
  <button class="btn ghost m-x" id="x" aria-label="Закрыть">✕</button>
  <div id="dbody"></div>
</dialog>

<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.title=SHOP.name;
$('#logo').textContent=SHOP.name;
$('#title').textContent=SHOP.name;
$('#tag').textContent=SHOP.tagline;
const vk=$('#vk1');vk.href=SHOP.vk;vk.textContent=SHOP.vkButton;
$('#foot').textContent='© '+new Date().getFullYear()+' '+SHOP.name;

/* тема */
const setIcon=()=>{$('#theme').textContent=document.documentElement.dataset.theme==='dark'?'☀ Светлая':'☾ Тёмная'};
setIcon();
$('#theme').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}setIcon()};

/* карточки */
const tilt=[-1.2,.9,-.5,1.2];
function card(p,i){
  return `<button class="card" data-i="${i}" style="--r:${tilt[i%4]}deg"><span class="tape"></span>
  <span class="pic"><b>${esc(p.name.replace(/[^\p{L}\p{N}]/u,'').charAt(0)||'•')}</b>${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">`:''}</span>
  <span class="nm">${esc(p.name)}</span><span class="pr">${esc(p.price)}</span></button>`;
}
function fill(sel,status,msg){
  const el=$(sel);let h='';
  PRODUCTS.forEach((p,i)=>{if(p.status===status)h+=card(p,i)});
  el.innerHTML=h||`<p class="empty">${msg}</p>`;
}
fill('#p-in','in','Сейчас всё разобрали. Загляни во вкладку «Под заказ» или напиши мне в ВК.');
fill('#p-pre','preorder','Пока ничего нет. Напиши мне в ВК, если хочешь что-то особенное.');

$('#steps').innerHTML=SHOP.steps.map(s=>`<li><b>${esc(s.t)}</b>${esc(s.d)}</li>`).join('');
$('#about').innerHTML=SHOP.about.map(t=>`<p>${esc(t)}</p>`).join('')+`<a class="btn" href="${esc(SHOP.vk)}" target="_blank" rel="noopener">${esc(SHOP.vkButton)}</a>`;

/* вкладки */
const map={in:'#p-in',pre:'#p-pre',how:'#p-how',about:'#p-about'};
function show(t){
  if(!map[t])t='in';
  for(const k in map){$(map[k]).hidden=k!==t}
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  history.replaceState(null,'','#'+t);
}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)};
show(location.hash.slice(1));

/* окно товара */
const dlg=$('#dlg');
document.addEventListener('click',e=>{
  const c=e.target.closest('.card');if(!c)return;
  const p=PRODUCTS[c.dataset.i];
  $('#dbody').innerHTML=(p.img?`<div class="m-pic"><img src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.parentNode.remove()"></div>`:'')+
  `<div class="m-body"><h2>${esc(p.name)}</h2><div class="pr">${esc(p.price)}</div><p>${esc(p.desc)}</p>
  <a class="btn" href="${esc(SHOP.vk)}" target="_blank" rel="noopener">${esc(SHOP.vkButton)}</a></div>`;
  dlg.showModal();
});
$('#x').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
</script>
</body>
</html>
